[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sardinha"
version = "0.1.0"
description = "Jogo do Thor: adivinhação de animais por árvore de decisão, no espírito do ANIMAL do BASIC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thor" }]
keywords = ["jogo", "basic", "arvore-de-decisao", "animais", "retro"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sardinha = "sardinha.cli:main"

[tool.setuptools.packages.find]
include = ["sardinha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
